services:
  - type: web
    name: argos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ANTHROPIC_API_KEY
        sync: false   # você informa no painel do Render (nunca no GitHub)
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
